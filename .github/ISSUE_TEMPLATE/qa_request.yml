name: QA Automation Request
description: Request a resource ID or other Mobile change required for QA automation
title: "[QA Automation] "
labels:
  - qa-automation
  - needs-mobile

body:
  - type: input
    id: feature
    attributes:
      label: Feature / Flow
      placeholder: "e.g. Login"
    validations:
      required: true

  - type: input
    id: screen
    attributes:
      label: Screen
      placeholder: "e.g. Login Page"
    validations:
      required: true

  - type: input
    id: element_name
    attributes:
      label: Element Name
      placeholder: "e.g. Country Selector"
    validations:
      required: true

  - type: textarea
    id: element_description
    attributes:
      label: Element Description
      placeholder: "Describe what this element does."
    validations:
      required: true

  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot
      description: Drag and drop a screenshot into this field.
      placeholder: "Attach a screenshot showing the requested element."

  - type: textarea
    id: notes
    attributes:
      label: Notes
      placeholder: "Add any additional context here."
