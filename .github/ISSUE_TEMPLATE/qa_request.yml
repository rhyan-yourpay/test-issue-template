name: QA Automation Request
description: Request a resource ID or other Mobile change required for QA automation
title: "[QA Automation] "
labels:
  - qa-automation
body:
  - type: markdown
    attributes:
      value: |
        Request one UI element change needed for QA automation (1 issue = 1 element).
        Example title: `[QA Automation] Add resource ID - Country Selector`

        Opening this issue creates a Jira sub-task under FE-46. Include the Jira key
        (e.g. `FE-123`) in branch and PR titles so development progress links correctly.

  - type: input
    id: feature
    attributes:
      label: Feature / Flow
      placeholder: "e.g. Login"
    validations:
      required: true

  - type: input
    id: screen
    attributes:
      label: Screen
      placeholder: "e.g. Login Page"
    validations:
      required: true

  - type: input
    id: element_name
    attributes:
      label: Element Name
      placeholder: "e.g. Country Selector"
    validations:
      required: true

  - type: textarea
    id: element_description
    attributes:
      label: Element Description
      placeholder: "Describe what this element does."
    validations:
      required: true

  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot
      description: Drag and drop a screenshot into this field.
      placeholder: "Attach a screenshot showing the requested element."

  - type: textarea
    id: notes
    attributes:
      label: Notes
      placeholder: "Add any additional context here."
