name: QA Automation Request
description: Request a resource ID or other Mobile change required for QA automation
title: "[QA Automation] "
labels:
  - qa-automation
  - needs-mobile

body:
  - type: input
    id: feature
    attributes:
      label: Feature / Flow
      placeholder: "e.g. Onboarding"
    validations:
      required: true

  - type: input
    id: screen
    attributes:
      label: Screen
      placeholder: "e.g. Registration Page 1"
    validations:
      required: true

  - type: input
    id: element_name
    attributes:
      label: Element Name
      placeholder: "e.g. Country Selector"
    validations:
      required: true

  - type: textarea
    id: element_description
    attributes:
      label: Element Description
      placeholder: "Describe what this element does."
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android
        - iOS
        - Android and iOS
    validations:
      required: true

  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot
      description: Drag and drop a screenshot into this field.
      placeholder: "Attach a screenshot showing the requested element."

  - type: input
    id: resource_id
    attributes:
      label: Resource ID
      description: Filled in by the Mobile team.
      value: TBD
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Notes
      placeholder: "Add any additional context here."
